<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 140" fill="none" class="w-full h-auto">
  <defs>
    <!-- Gradient definition matching Zauqode brand specifications -->
    <linearGradient id="zauqode-mark-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F6B6B" />
      <stop offset="50%" stop-color="#BFE5D5" />
      <stop offset="100%" stop-color="#D9B36C" />
    </linearGradient>
    <linearGradient id="zauqode-gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D9B36C" />
      <stop offset="100%" stop-color="#0F6B6B" />
    </linearGradient>
    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Abstract Emblem Mark (Geometric Z + Liquid Flame/Gem Motif) -->
  <g transform="translate(10, 10)">
    <!-- Layered glass path teal -->
    <path d="M45 15 C75 15, 95 35, 95 65 C95 95, 75 115, 45 115 C25 115, 15 100, 15 85 C15 70, 30 65, 45 65 C65 65, 75 50, 75 35 C75 25, 60 15, 45 15 Z" fill="url(#zauqode-mark-grad)" opacity="0.9" />
    
    <!-- Accent Gold dynamic ribbon -->
    <path d="M25 30 L85 30 L35 100 L95 100" stroke="url(#zauqode-gold-grad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.95" />
    
    <!-- Mint refraction spark -->
    <circle cx="85" cy="30" r="5" fill="#BFE5D5" />
    <circle cx="35" cy="100" r="5" fill="#D9B36C" />
  </g>
  
  <!-- Typographic Brand Name: ZAUQODE -->
  <g transform="translate(130, 82)">
    <text font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="800" font-size="44" letter-spacing="6" fill="#0F6B6B">
      ZAUQODE
    </text>
    <text font-family="'DM Serif Display', 'Playfair Display', serif" font-style="italic" font-weight="400" font-size="14" letter-spacing="3" fill="#D9B36C" x="4" y="24">
      WHERE TASTE MEETS DIGITAL
    </text>
  </g>
</svg>
